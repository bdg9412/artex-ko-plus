name: ${ARTEX_PROJECT_NAME:-artex-local}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/local-start.sh first}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  artex:
    image: ${ARTEX_LOCAL_IMAGE:-artex-ko-local:dev}
    build:
      context: .
      dockerfile: Dockerfile.local
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "127.0.0.1:${ARTEX_LOCAL_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_LOCAL_PROXY_PORT:-8788}:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - type: bind
        source: ./.local-runtime/jwt.key
        target: /app/jwt.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
